
<!DOCTYPE html>
<html>
<head>
    <title>IPL Auction 2027</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #07152e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ffb800;
            font-size: 32px;
        }
        .card {
            background: #142b50;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }
        button {
            background: #ffb800;
            color: black;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🏏 IPL AUCTION</h1>
    <p>THE ULTIMATE BIDDING BATTLE</p>

    <div class="card">
        <h2>Welcome to IPL Auction</h2>
        <p>Build your dream team!</p>
        <button onclick="startGame()">START AUCTION</button>
    </div>

    <script>
        function startGame() {
            alert("Welcome to IPL Auction!");
        }
    </script>
<div class="card">
    <h2>Choose Your Team</h2>

    <input id="team1" placeholder="Player 1 Team Name">

    <br><br>

    <input id="team2" placeholder="Player 2 Team Name">

    <br><br>

    <button onclick="saveTeams()">Continue</button>
</div>

<script>
function saveTeams() {
    let t1 = document.getElementById("team1").value;
    let t2 = document.getElementById("team2").value;

    if (!t1 || !t2) {
        alert("Enter both team names!");
        return;
    }

    alert(t1 + " VS " + t2);
}
</script>
<div class="card">
    <h2>💰 TEAM PURSE</h2>

    <h3 id="purse1">₹100 Crore</h3>
    <h3 id="purse2">₹100 Crore</h3>

    <p>Each team gets ₹100 Crore to build their squad.</p>
</div>
</body>
</html>
